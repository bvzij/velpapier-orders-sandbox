<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('vp_theme') || 'light');</script>
  <style>body{padding-top:56px}body::before{content:'';position:fixed;top:0;left:0;right:0;height:56px;background:var(--surface);border-bottom:0.5px solid var(--border);z-index:119;pointer-events:none}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vel Papier · Productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .pr-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .pr-search-wrap { flex: 1; min-width: 220px; position: relative; }
    .pr-search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
    .pr-search { width: 100%; padding: 9px 10px 9px 32px; font-size: 14px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--text); font-family: inherit; }
    .pr-stat { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .pr-save-bar { position: sticky; top: 56px; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 10px 14px; margin-bottom: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .pr-save-bar.is-empty { display: none; }
    .pr-save-text { font-size: 13px; font-weight: 600; }
    .pr-save-btn { background: var(--text); color: var(--surface); border: none; border-radius: var(--radius-md); padding: 9px 18px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
    .pr-save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pr-discard-btn { background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); padding: 9px 14px; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--text-muted); }

    .pr-product { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; }
    .pr-product-top { display: flex; gap: 14px; align-items: flex-start; }
    .pr-product-info { flex: 1; min-width: 0; padding-top: 2px; }
    .pr-product-name { font-size: 15px; font-weight: 700; }
    .pr-product-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .pr-variants { margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .pr-variant { display: flex; flex-direction: column; gap: 6px; }
    .pr-variant-label { font-size: 12px; font-weight: 600; line-height: 1.3; }
    .pr-variant-sku { font-size: 11px; color: var(--text-faint); }

    .pr-box { position: relative; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md); background: var(--bg); overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.12s, background 0.12s; }
    .pr-box.pr-box--parent { width: 110px; height: 110px; flex: 0 0 auto; }
    .pr-box.pr-box--variant { width: 100%; aspect-ratio: 1 / 1; }
    .pr-box:hover { border-color: var(--text-muted); }
    .pr-box.drag-over { border-color: var(--pr-accent, #1f8a4c); background: var(--surface2); }
    .pr-box.has-image { border-style: solid; border-color: var(--border); }
    .pr-box.is-pending { border-color: #d9a400; border-style: solid; }
    .pr-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pr-box-empty { font-size: 20px; color: var(--text-faint); }
    .pr-box-plus { position: absolute; bottom: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); color: var(--surface); font-size: 13px; display: flex; align-items: center; justify-content: center; line-height: 1; pointer-events: none; }
    .pr-box-pending-badge { position: absolute; top: 4px; left: 4px; background: #d9a400; color: #1a1500; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; pointer-events: none; }
    .pr-box-progress { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; }
    .pr-box-ok { position: absolute; inset: 0; background: rgba(31,138,76,0.85); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
    .pr-box-err { position: absolute; bottom: 0; left: 0; right: 0; background: #d92d20; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 4px; text-align: center; }
    .pr-box input[type=file] { display: none; }

    .pr-empty-state { padding: 3rem 1rem; text-align: center; color: var(--text-muted); font-size: 14px; }

    @media (max-width: 560px) {
      .pr-product-top { flex-wrap: wrap; }
      .pr-variants { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }
  </style>
  <style>
    /* ── Productos: tabs, listings, editor (listados.js) ── */
    .pr-tabs { max-width: 620px; }
    .ls-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .ls-selbar { position: sticky; top: 56px; z-index: 40; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 10px 14px; margin-bottom: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .ls-selbar .grow { flex: 1; font-size: 13px; font-weight: 600; }
    .ls-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px; }
    .ls-row.is-selected { border-color: var(--text-muted); background: var(--surface2); }
    .ls-check { width: 18px; height: 18px; flex: 0 0 auto; cursor: pointer; }
    .ls-thumb { width: 52px; height: 52px; flex: 0 0 auto; border-radius: var(--radius-sm); background: var(--bg); border: 0.5px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; color: var(--text-faint); }
    .ls-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .ls-main { flex: 1; min-width: 0; cursor: pointer; }
    .ls-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ls-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .ls-when { font-size: 11px; color: var(--text-faint); white-space: nowrap; width: 70px; text-align: right; }
    .ls-dot { min-width: 22px; height: 22px; border-radius: 11px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
    .ls-dot--red { background: var(--red-bg); color: var(--red-text); }
    .ls-dot--amber { background: var(--amber-bg); color: var(--amber-text); }
    .ls-dot--green { background: var(--green-bg); color: var(--green-text); }
    .ls-pill--Borrador { background: var(--surface2); color: var(--text-muted); }
    .ls-pill--Listo { background: var(--blue-bg); color: var(--blue-text); }
    .ls-pill--Exportado { background: var(--green-bg); color: var(--green-text); }
    .ls-pill--Archivado { background: var(--surface2); color: var(--text-faint); text-decoration: line-through; }

    .ls-editor { position: fixed; inset: 0; z-index: 300; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .ls-editor-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 10px 16px; }
    .ls-editor-head .grow { flex: 1; min-width: 160px; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ls-dirty { font-size: 12px; color: var(--amber-text); }
    .ls-editor-body { max-width: 980px; margin: 0 auto; padding: 16px; }
    .ls-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px; }
    .ls-card-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
    .ls-ai { border-color: var(--purple-text); background: linear-gradient(0deg, var(--surface), var(--purple-bg)); }
    .ls-grid { display: flex; flex-wrap: wrap; gap: 0 12px; }
    .ls-field { display: block; width: 100%; margin-bottom: 10px; }
    .ls-half { width: calc(50% - 6px); }
    .ls-third { width: calc(25% - 9px); }
    .ls-label { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: capitalize; }
    .ls-input { width: 100%; padding: 8px 10px; font-size: 14px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-family: inherit; }
    textarea.ls-input { resize: vertical; line-height: 1.45; }
    .ls-help { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 3px; line-height: 1.4; }
    .ls-count { font-weight: 500; color: var(--text-faint); text-transform: none; margin-left: auto; }
    .ls-count.over { color: var(--red-text); font-weight: 700; }
    .ls-ai-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ls-mini { background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; font-family: inherit; cursor: pointer; color: var(--text); }
    .ls-mini:hover { background: var(--surface2); }
    .ls-link { font-size: 13px; }
    .ls-preflight { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 10px 16px; margin-bottom: 12px; font-size: 12.5px; }
    .ls-preflight ul { margin: 6px 0 0 18px; }
    .pf-head { font-weight: 700; }
    .pf-ok { color: var(--green-text); }
    .pf-err { color: var(--red-text); }
    .pf-warn { color: var(--amber-text); }
    .ls-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .ls-gimg, .ls-gadd { position: relative; aspect-ratio: 1 / 1; border-radius: var(--radius-md); overflow: hidden; border: 0.5px solid var(--border); background: var(--bg); }
    .ls-gimg img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
    .ls-gmain { position: absolute; top: 4px; left: 4px; background: var(--text); color: var(--surface); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; }
    .ls-gbtns { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; background: rgba(0,0,0,0.45); }
    .ls-gbtns button { background: none; border: none; color: #fff; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    .ls-gadd { border: 1.5px dashed var(--border-strong); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: var(--text-muted); text-align: center; padding: 6px; }
    .ls-gadd input { display: none; }
    .ls-gadd.drag-over { border-color: #1f8a4c; background: var(--surface2); color: #1f8a4c; }
    .ls-table-wrap { overflow-x: auto; }
    .ls-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ls-table th { text-align: left; font-size: 11px; color: var(--text-faint); font-weight: 600; padding: 4px; white-space: nowrap; }
    .ls-table td { padding: 3px 4px; border-top: 0.5px solid var(--border); vertical-align: middle; }
    .ls-cell { width: 100%; min-width: 80px; padding: 6px 8px; font-size: 13px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-family: inherit; }
    .ls-cell:disabled { opacity: 0.5; }
    .ls-num { min-width: 64px; max-width: 90px; text-align: center; }
    .ls-sku { min-width: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .ls-sku-hint { display: block; font-size: 10.5px; color: var(--amber-text); white-space: nowrap; margin-top: 2px; }
    .ls-pf-pill { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 99px; vertical-align: middle; text-transform: none; line-height: 1.5; }
    .ls-req { color: #c23b3b; font-weight: 700; }
    .ls-viewtoggle { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .ls-viewtoggle-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .ls-vt-btn { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: 99px; padding: 5px 14px; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer; color: var(--text-muted); }
    .ls-vt-btn.is-active[data-vt-color="tiktok"] { background: #E9F1FA; color: #3B5FA0; border-color: #3B5FA0; }
    .ls-vt-btn.is-active[data-vt-color="shopify"] { background: #ECF3E0; color: #4A6B24; border-color: #4A6B24; }
    .ls-vt-btn.is-active[data-vt-color=""] { background: var(--text); color: var(--surface); border-color: var(--text); }
    .ls-translate-btn { margin-left: 8px; font-size: 10.5px; padding: 2px 8px; }
    .ls-vimg-pair { display: flex; align-items: stretch; gap: 3px; }
    .ls-vimg-box { width: 36px; height: 36px; aspect-ratio: 1 / 1; padding: 0; border-radius: var(--radius-sm); border: 1px dashed var(--border-strong); background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; color: var(--text-faint); font-family: inherit; flex: 0 0 auto; }
    .ls-vimg-box img { width: 100%; height: 100%; object-fit: cover; }
    .ls-vimg-pick { width: 22px; height: 36px; padding: 0; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface2); cursor: pointer; font-size: 12px; flex: 0 0 auto; }
    .ls-vimg-disabled { width: 36px; height: 36px; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); border: 1px dashed var(--border); background: var(--bg); color: var(--text-faint); opacity: 0.45; }
    .ls-x { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 14px; padding: 4px 6px; }
    .ls-x:disabled { opacity: 0.25; cursor: default; }
    .ls-vord { white-space: nowrap; }
    .ls-x:hover { color: var(--red-text); }
    .ls-details summary { cursor: pointer; font-size: 13px; padding: 4px 0; }
    .ls-details[open] summary { margin-bottom: 8px; }
    .pp-list { max-height: 60vh; overflow-y: auto; }
    .pp-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px; margin-bottom: 6px; cursor: pointer; font-family: inherit; color: var(--text); font-size: 13px; }
    .pp-item:hover { background: var(--surface2); }
    .pp-item img, .pp-noimg { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--bg); flex: 0 0 auto; }
    .pa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 60vh; overflow-y: auto; }
    .pa-tile { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); padding: 4px; cursor: pointer; font-family: inherit; color: var(--text); font-size: 11px; overflow: hidden; }
    .pa-tile img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 4px; display: block; margin-bottom: 3px; }
    .pa-tile span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pa-tile.is-picked { border-color: var(--green-text); background: var(--green-bg); }
    .pa-crumbs { font-size: 12.5px; margin-bottom: 8px; }
    .pa-crumbs a { color: var(--text-muted); text-decoration: none; }
    .pa-folder { grid-column: span 1; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); padding: 8px 6px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; text-align: left; color: var(--text); }
    .ex-list { margin: 0 0 8px 18px; font-size: 13px; }
    .ex-blocked { background: var(--red-bg); color: var(--red-text); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; }
    .ex-blocked ul { margin: 6px 0 0 18px; }
    @media (max-width: 640px) {
      .ls-half, .ls-third { width: 100%; }
      .ls-when { display: none; }
      .ls-editor-body { padding: 10px; }
    }
  </style>
</head>
<body>

<main class="vp-shell vp-shell--wide">

  <section class="vp-hero" style="padding-bottom:1.25rem">
    <h1 class="vp-hero-greet" style="font-size:clamp(26px,4vw,38px)">Productos</h1>
    <div class="vp-hero-date">Fichas para TikTok y Shopify, fotos del catálogo y plantillas</div>
  </section>

  <div class="tabs pr-tabs">
    <button class="tab" data-pr-tab="listados" onclick="vpListados.tab('listados')">Fichas</button>
    <button class="tab" data-pr-tab="fotos" onclick="vpListados.tab('fotos')">Fotos del catálogo</button>
    <button class="tab" data-pr-tab="organizar" onclick="vpListados.tab('organizar')">Organizar</button>
    <button class="tab" data-pr-tab="plantillas" onclick="vpListados.tab('plantillas')">Plantillas</button>
    <button class="tab" data-pr-tab="ajustes" onclick="vpListados.tab('ajustes')">Ajustes</button>
  </div>

  <!-- ── Fichas (listados.js) ── -->
  <section data-pr-panel="listados">
    <div class="ls-toolbar">
      <div class="pr-search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="ls-search" class="pr-search" placeholder="Buscar título, SKU, LST-… o PARENT-…" oninput="vpListados.renderList()">
      </div>
      <select id="ls-status" class="sort-select" onchange="vpListados.renderList()">
        <option value="activos">Activos</option>
        <option value="Borrador">Borradores</option>
        <option value="Listo">Listos</option>
        <option value="Exportado">Exportados</option>
        <option value="Archivado">Archivados</option>
        <option value="todos">Todos</option>
      </select>
      <div class="pr-stat" id="ls-stat"></div>
      <button class="refresh-btn" onclick="vpListados.load()">↻ Actualizar</button>
      <button class="btn btn-primary" onclick="vpListados.open()">+ Nuevo producto</button>
    </div>
    <div class="ls-selbar" id="ls-selbar" style="display:none">
      <span class="grow" id="ls-seltext"></span>
      <button class="ls-mini" onclick="vpListados.selectAllVisible()">Seleccionar todos los visibles</button>
      <button class="ls-mini" onclick="vpListados.clearSel()">Quitar selección</button>
      <button class="btn btn-primary" onclick="vpListados.exportDialog('tiktok')">Exportar a TikTok</button>
      <button class="btn" onclick="vpListados.exportDialog('shopify')">Exportar a Shopify</button>
    </div>
    <div id="ls-list"><div class="pr-empty-state">Cargando…</div></div>
  </section>

  <!-- ── Fotos del catálogo (productos.js, unchanged) ── -->
  <section data-pr-panel="fotos" style="display:none">
    <div class="pr-toolbar">
      <div class="pr-search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="pr-search" class="pr-search" placeholder="Buscar producto, SKU o variante…" oninput="vpProductos.render()">
      </div>
      <select id="pr-channel" class="sort-select" onchange="vpProductos.render()">
        <option value="all">Todos los canales</option>
        <option value="tiktok">TikTok</option>
        <option value="shopify">Shopify</option>
      </select>
      <select id="pr-sort" class="sort-select" onchange="vpProductos.render()">
        <option value="name">Nombre A-Z</option>
        <option value="created">Más reciente</option>
        <option value="sold">Más vendidos</option>
      </select>
      <div class="pr-stat" id="pr-stat"></div>
      <button class="refresh-btn" id="pr-refresh" onclick="vpProductos.load(true)">↻ Actualizar</button>
    </div>

    <div class="pr-save-bar is-empty" id="pr-save-bar">
      <div class="pr-save-text" id="pr-save-text"></div>
      <div style="display:flex;gap:8px">
        <button class="pr-discard-btn" id="pr-discard-btn" onclick="vpProductos.discardAll()">Descartar</button>
        <button class="pr-save-btn" id="pr-save-btn" onclick="vpProductos.saveAll()">Guardar todo</button>
      </div>
    </div>

    <div id="pr-list"></div>
  </section>

  <!-- ── Organizar (organizar.js) ── -->
  <section data-pr-panel="organizar" style="display:none"><div id="org-body"></div></section>

  <!-- ── Plantillas ── -->
  <section data-pr-panel="plantillas" style="display:none"><div id="tp-body"><div class="pr-empty-state">Cargando…</div></div></section>

  <!-- ── Ajustes ── -->
  <section data-pr-panel="ajustes" style="display:none"><div id="aj-body"><div class="pr-empty-state">Cargando…</div></div></section>

</main>

<!-- ── Editor (full screen) ── -->
<div class="ls-editor" id="ls-editor" style="display:none">
  <div class="ls-editor-head">
    <button class="ls-mini" onclick="vpListados.close()">← Volver</button>
    <span class="grow" id="ls-editor-title"></span>
    <span class="ls-dirty" id="ls-dirty"></span>

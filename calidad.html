<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('vp_theme') || 'light');</script>
  <style>body::before{content:'';position:fixed;top:0;left:0;right:0;height:56px;background:var(--surface);border-bottom:0.5px solid var(--border);z-index:119;pointer-events:none}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vel Papier · Calidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="vp-shell vp-shell--wide">

  <section class="vp-hero" style="padding-bottom:1.25rem">
    <h1 class="vp-hero-greet" style="font-size:clamp(26px,4vw,38px)">Calidad</h1>
    <div class="vp-hero-date" id="cal-count">—</div>
  </section>

  <div class="cal-toolbar">
    <button class="refresh-btn cal-filter-toggle" id="cal-filter-toggle">Filtros</button>
    <div class="cal-toolbar-right">
      <div class="vp-period" id="cal-viewmode">
        <button class="vp-period-btn is-active" data-mode="tiles">Mosaico</button>
        <button class="vp-period-btn" data-mode="list">Lista</button>
      </div>
      <a class="refresh-btn" href="qc.html" style="text-decoration:none">Ir a empacar →</a>
    </div>
  </div>

  <div class="cal-layout">

    <aside class="cal-sidebar" id="cal-sidebar">
      <div class="cal-sidebar-head">
        <span class="cal-sidebar-title">Filtros</span>
        <button class="cal-sidebar-close" id="cal-sidebar-close" aria-label="Cerrar filtros">&times;</button>
      </div>

      <label class="cal-field">
        <span class="cal-field-label">Buscar</span>
        <input class="vp-input" id="cal-search" type="text"
               placeholder="Producto, guía, pedido, usuario…" autocomplete="off">
        <span class="cal-field-hint">Producto, número de guía, pedido de TikTok o Shopify, o usuario</span>
      </label>

      <div class="cal-field">
        <span class="cal-field-label">Cliente</span>
        <div class="cal-combo">
          <input class="vp-input" id="cal-customer" type="text"
                 placeholder="Todos los clientes" autocomplete="off">
          <div class="cal-combo-list" id="cal-customer-list"></div>
        </div>
      </div>

      <div class="cal-field">
        <span class="cal-field-label">Desde</span>
        <input class="vp-input" id="cal-from" type="date">
      </div>

      <div class="cal-field">
        <span class="cal-field-label">Hasta</span>
        <input class="vp-input" id="cal-to" type="date">
      </div>

      <button class="refresh-btn cal-clear-btn" id="cal-clear">Limpiar filtros</button>
    </aside>

    <div class="cal-sidebar-backdrop" id="cal-sidebar-backdrop"></div>

    <div class="cal-main">
      <div id="cal-pagination-top" class="cal-pagination-slot"></div>
      <div id="cal-content"><div class="vp-loading">Cargando historial de calidad</div></div>
      <div id="cal-pagination-bottom" class="cal-pagination-slot"></div>
    </div>

  </div>

</main>

<div id="modal-container"></div>

<script src="common.js"></script>
<script src="calidad.js"></script>
</body>
</html>

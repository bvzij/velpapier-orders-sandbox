<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vel Papier · Calidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="vp-shell vp-shell--wide">

  <section class="vp-hero" style="padding-bottom:1.25rem">
    <h1 class="vp-hero-greet" style="font-size:clamp(26px,4vw,38px)">Calidad</h1>
    <div class="vp-hero-date" id="cal-count">—</div>
  </section>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem">
    <div class="vp-period" id="cal-view">
      <button class="vp-period-btn is-active" data-view="envios">Por envío</button>
      <button class="vp-period-btn" data-view="sesiones">Por sesión</button>
    </div>
    <a class="refresh-btn" href="qc.html" style="text-decoration:none">Ir a empacar →</a>
  </div>

  <div class="vp-qc-filters" id="cal-filters">
    <input class="vp-input" id="cal-search" type="text" placeholder="Buscar usuario o guía…" autocomplete="off" style="flex:1;min-width:220px">
    <select class="vp-input" id="cal-packer"><option value="">Todos los empacadores</option></select>
    <select class="vp-input" id="cal-session"><option value="">Todas las sesiones</option></select>
  </div>

  <div id="cal-content"><div class="vp-loading">Cargando historial de calidad</div></div>

  <div style="text-align:center;margin-top:1.5rem">
    <button class="refresh-btn" id="cal-more" style="display:none;margin:0 auto">Cargar más</button>
  </div>

</main>

<script src="common.js"></script>
<script src="calidad.js"></script>
</body>
</html>

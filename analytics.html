<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('vp_theme') || 'light');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vel Papier · Ajustes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="vp-shell">

  <section class="vp-hero" style="padding-bottom:1.25rem">
    <h1 class="vp-hero-greet" style="font-size:clamp(26px,4vw,38px)">Ajustes</h1>
    <div class="vp-hero-date">Preferencias y herramientas del panel</div>
  </section>

  <div class="aj-section">
    <div class="aj-section-title">Apariencia</div>
    <div class="aj-card aj-row">
      <div>
        <div class="aj-row-label">Tema</div>
        <div class="aj-row-hint">Elige cómo se ve el panel en este dispositivo</div>
      </div>
      <div class="vp-period" id="aj-theme-toggle">
        <button class="vp-period-btn" data-theme="light">Claro</button>
        <button class="vp-period-btn" data-theme="dark">Oscuro</button>
      </div>
    </div>
  </div>

  <div class="aj-section">
    <div class="aj-section-title">Clientes duplicados</div>
    <div class="aj-card">
      <div class="aj-row" style="margin-bottom:0">
        <div>
          <div class="aj-row-label">Buscar posibles duplicados</div>
          <div class="aj-row-hint">Compara clientes con teléfono, dirección o nombre similar y sugiere cuáles fusionar</div>
        </div>
        <button class="refresh-btn" id="aj-scan-duplicates">Buscar duplicados</button>
      </div>
      <div id="aj-duplicates-content" style="margin-top:1rem"></div>
    </div>
  </div>

</main>

<div id="modal-container"></div>

<script src="common.js"></script>
<script>VP.mountNav('ajustes');</script>
<script src="ajustes.js"></script>
</body>
</html>

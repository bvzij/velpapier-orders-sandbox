<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('vp_theme') || 'light');</script>
  <style>body::before{content:'';position:fixed;top:0;left:0;right:0;height:56px;background:var(--surface);border-bottom:0.5px solid var(--border);z-index:119;pointer-events:none}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vel Papier · Análisis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="vp-shell vp-shell--wide">

  <section class="vp-hero" style="padding-bottom:1.25rem">
    <h1 class="vp-hero-greet" style="font-size:clamp(26px,4vw,38px)">Análisis</h1>
    <div class="vp-hero-date" id="an-range">—</div>
  </section>

      <div class="vp-period" id="an-period" style="flex:0 0 auto;">
      <button class="vp-period-btn is-active" data-days="30">30 días</button>
      <button class="vp-period-btn" data-days="90" disabled>90 días</button>
      <button class="vp-period-btn" data-days="365" disabled>1 año</button>
      <button class="vp-period-btn" data-days="0" disabled>Todo</button>
    </div>
    <span class="vp-section-note" id="an-count">—</span>
    <span class="vp-section-note" id="an-updating-note" style="display:none;opacity:.65;font-style:italic;">· Actualizando las demás vistas…</span>
  </div>

  <div id="an-content">
    <div class="vp-loading">Cargando pedidos, clientes y sesiones</div>
  </div>

</main>

<script src="common.js"></script>
<script src="analytics.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vel Papier · Análisis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="vp-shell vp-shell--wide">

  <section class="vp-hero" style="padding-bottom:1.25rem">
    <h1 class="vp-hero-greet" style="font-size:clamp(26px,4vw,38px)">Análisis</h1>
    <div class="vp-hero-date" id="an-range">—</div>
  </section>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.75rem">
    <div class="vp-period" id="an-period">
      <button class="vp-period-btn" data-days="30">30 días</button>
      <button class="vp-period-btn is-active" data-days="90">90 días</button>
      <button class="vp-period-btn" data-days="365">1 año</button>
      <button class="vp-period-btn" data-days="0">Todo</button>
    </div>
    <span class="vp-section-note" id="an-count">—</span>
  </div>

  <div id="an-content">
    <div class="vp-loading">Cargando pedidos, clientes y sesiones</div>
  </div>

</main>

<script src="common.js"></script>
<script src="analytics.js"></script>
</body>
</html>
